name: Build and release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Install Dalamud API 15 SDK files
        shell: pwsh
        run: |
          $dalamudDev = Join-Path $env:APPDATA 'XIVLauncher\addon\Hooks\dev'
          New-Item -ItemType Directory -Path $dalamudDev -Force | Out-Null
          Invoke-WebRequest -Uri 'https://raw.githubusercontent.com/goatcorp/dalamud-distrib/a44d77c7f7927aec7f706df3ab3cb6d4f45f2a59/stg/latest.zip' -OutFile 'dalamud-latest.zip'
          Expand-Archive -LiteralPath 'dalamud-latest.zip' -DestinationPath $dalamudDev -Force

      - name: Verify release version
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $tagVersion = $env:GITHUB_REF_NAME -replace '^v', ''
          [xml]$project = Get-Content 'HousingTimeoutReminder/HousingTimeoutReminder.csproj' -Raw
          $projectVersion = $project.SelectSingleNode('/Project/PropertyGroup/Version').InnerText
          if ($tagVersion -ne $projectVersion) { throw "Tag version $tagVersion must match project version $projectVersion." }

      - name: Build plugin package
        run: dotnet build .\HousingTimeoutReminder.sln --configuration Release -p:RestoreLockedMode=true

      - name: Check owned housing addresses and inside-visit rules
        run: dotnet run --project tests/HousingChecks/HousingChecks.csproj --configuration Release

      - name: Prepare release asset
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: Copy-Item -LiteralPath 'bin/Release/HousingTimeoutReminder/latest.zip' -Destination 'HousingTimeoutReminder.zip' -Force

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          name: ${{ github.ref_name }}
          body_path: RELEASE-NOTES.md
          files: HousingTimeoutReminder.zip
