name: Housing Timeout Reminder
internal_name: HousingTimeoutReminder
author: Neko Boi Nick
punchline: Remind you to visit your house just in case you forgot.
description: |-
  A plugin to remind you about your house on FFXIV just in case you forgot to visit it.
repo_url: https://github.com/Jacob5800/HousingTimeoutReminder
tags:
  - Utility
icon_url: https://raw.githubusercontent.com/Jacob5800/HousingTimeoutReminder/main/HousingTimeoutReminder/images/icon.png
changelog: |-
  ### 1.0.5.0
  - Automatically detect owned personal houses and FC estates, including district, ward, and plot.
  - Track saved alt characters and show their reminders by default.
  - Count visits only inside the matching estate; yards and FC private chambers do not count.
  - Remove apartment reminders and simplify housing settings.
  - Fix the all-character toggle and warning display.
